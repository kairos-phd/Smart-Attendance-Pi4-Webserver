name: Verify website and gateway

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  website:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test:pi-stream
      - run: node --test tests/pi-data.test.cjs tests/pi-media.test.cjs tests/table-pagination.test.cjs tests/unknown-review.test.cjs
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: website-verification-build-${{ matrix.os }}
          path: apps/web/web-build
          retention-days: 7
          if-no-files-found: error

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-media.txt 'httpx>=0.27,<1'
      - run: python -m unittest discover -s tests -p 'test_pi_*.py'
      - run: python -m unittest discover -s tests -p 'test_gateway_accounts.py'
